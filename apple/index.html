  <!-- Apply the saved mode (light/dark) and the route's brand theme before first paint to avoid a flash.
       The brand comes from the route (/npro/<company>) or, in a locked session, from the session's company.
       The company list is injected from src/lib/brandIds.ts by vite.config.ts; the theme-tools flag comes from .env. -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      var companies = ["microsoft","anthropic","google","apple","meta","netflix","amazon","openai","syntax","atelier"];
      var aliases = {"me":"signal","myself":"signal","personal":"signal","portfolio":"signal","resume":"signal","cv":"signal","msft":"microsoft","ms":"microsoft","windows":"microsoft","azure":"microsoft","dotnet":"microsoft","vscode":"microsoft","xbox":"microsoft","linkedin":"microsoft","claude":"anthropic","claudeai":"anthropic","chrome":"google","gemini":"google","android":"google","alphabet":"google","gcp":"google","deepmind":"google","youtube":"google","mac":"apple","macos":"apple","macbook":"apple","imac":"apple","iphone":"apple","ipad":"apple","ipod":"apple","ios":"apple","watchos":"apple","safari":"apple","icloud":"apple","facebook":"meta","fb":"meta","instagram":"meta","insta":"meta","whatsapp":"meta","threads":"meta","oculus":"meta","quest":"meta","nflx":"netflix","stream":"netflix","streaming":"netflix","aws":"amazon","prime":"amazon","chatgpt":"openai","gpt":"openai","gpt4":"openai","gpt5":"openai","sora":"openai","dev":"syntax","code":"syntax","ide":"syntax","terminal":"syntax","design":"atelier","studio":"atelier","photo":"atelier","photography":"atelier","gallery":"atelier"};
      var toolsOn = 'false' === 'true' || localStorage.getItem('npro-unlock-themes') === 'true';
      var m = location.pathname.match(/^\/npro\/([^\/]+)/);
      var seg = m ? m[1].toLowerCase() : null;
      // An alias route (e.g. /npro/gemini) paints as its target theme; SiteRoute redirects the URL after mount.
      var brand = seg && companies.indexOf(seg) > -1 ? seg : seg && aliases[seg] ? aliases[seg] : null;
      if (brand === 'signal') brand = null; // signal is the unmarked default, e.g. alias /npro/me
      var lock = sessionStorage.getItem('npro-company-lock');
      if (!toolsOn && lock && companies.indexOf(lock) > -1) brand = lock;
      if (brand) {
        document.documentElement.setAttribute('data-theme', brand);
        var favicon = document.getElementById('favicon-svg');
        if (favicon) favicon.setAttribute('href', '/npro/favicon-' + brand + '.svg');
      }
    } catch (e) {}
  </script>
